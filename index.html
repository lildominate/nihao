    <title>Nǐ hǎo</title>
    <script>
      // Apply the saved theme before first paint (no light flash in dark mode).
      (function () {
        try {
          var s = (JSON.parse(localStorage.getItem('nihao/v1') || '{}').settings) || {}
          var t = s.theme || 'system'
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.dataset.theme = dark ? 'dark' : 'light'
          if (s.reduceMotion) root.dataset.reduceMotion = ''
          document.querySelector('meta[name=theme-color]').setAttribute('content', dark ? '#15131a' : '#fbf5ec')
        } catch (e) {}
      })()
    </script>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
